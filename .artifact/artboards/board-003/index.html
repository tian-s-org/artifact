<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>画布查看器</title>
<link rel="stylesheet" href="../../assets/css/mock.css">
</head>
<body>
  <div class="viewer">
    <div class="float name">artifact 自举原型</div>
    <div class="float user"><span class="avatar">T</span><span>tianyongwei</span></div>

    <!-- 悬停中的画框：蓝描边 + 尺寸标签 -->
    <div class="frame hover" style="left:80px;top:170px;width:360px;height:225px">
      <span class="spec">01 技能库 · 1440 × 900</span>
      <div class="mini">
        <div class="top">技能库</div>
        <div class="body"><div class="side"></div><div class="main">
          <div class="bar w60"></div><div class="bar"></div><div class="bar w40"></div><div class="block"></div>
        </div></div>
      </div>
    </div>

    <div class="frame" style="left:500px;top:170px;width:360px;height:225px">
      <span class="label"><span class="index">02</span><span>同步矩阵</span></span>
      <div class="mini">
        <div class="top">同步矩阵</div>
        <div class="body"><div class="main">
          <div class="bar w60"></div><div class="bar"></div><div class="bar"></div><div class="bar w40"></div>
        </div></div>
      </div>
    </div>

    <div class="frame" style="left:920px;top:170px;width:256px;height:192px">
      <span class="label"><span class="index">03</span><span>设置</span></span>
      <div class="mini">
        <div class="top">设置</div>
        <div class="body"><div class="main">
          <div class="bar w60"></div><div class="bar w40"></div><div class="bar"></div>
        </div></div>
      </div>
    </div>

    <div class="tools">
      <span>拖拽平移 · 滚轮缩放 · 双击画框放大</span>
      <span class="sep"></span>
      <span style="background:rgba(0,0,0,.06);color:var(--ink);padding:4px 9px;border-radius:6px">尺寸</span>
      <span>适应窗口</span>
      <span>100%</span>
      <span class="pct">24%</span>
    </div>
  </div>
</body>
</html>
