<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>品牌核心</title>
<style>
  :root { --accent: #1d4ed8; --ink: #14161a; --ink-2: #5a6169; --line: rgba(0,0,0,.09); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #fbfaf8;
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: var(--ink); }
  .card { width: 100%; height: 100%; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 18px; }
  .accent { fill: var(--accent); }
  h1 { margin: 0; font-size: 40px; letter-spacing: -.02em; font-weight: 650; }
  .tag { color: var(--ink-2); font-size: 15px; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .cell { background: #fff; padding: 22px; }
  .cell b { display: block; font-size: 13px; margin-bottom: 6px; }
  .cell span { color: var(--ink-2); font-size: 12px; }
  .swatches { display: flex; gap: 10px; }
  .sw { width: 56px; text-align: center; font-size: 11px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; }
  .sw i { display: block; height: 44px; border-radius: 8px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.06); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-label="Northstar">
        <circle cx="36" cy="36" r="26" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <path class="accent" d="M36 14 L42 30 L58 36 L42 42 L36 58 L30 42 L14 36 L30 30 Z"/>
      </svg>
      <div>
        <h1>Northstar</h1>
        <div class="tag">小批量烘焙 · 第三波咖啡</div>
      </div>
    </div>

    <div class="grid">
      <div class="cell"><b>标志</b><span>单线几何星形，最小尺寸 18px</span></div>
      <div class="cell"><b>字标</b><span>大写首字母，字距 -0.02em</span></div>
      <div class="cell"><b>安全边距</b><span>四周留 1× 星形半径</span></div>
    </div>

    <div class="swatches">
      <div class="sw"><i style="background:#1d4ed8"></i>#1D4ED8</div>
      <div class="sw"><i style="background:#14161a"></i>#14161A</div>
      <div class="sw"><i style="background:#fbfaf8"></i>#FBFAF8</div>
      <div class="sw"><i style="background:#b45309"></i>#B45309</div>
    </div>
  </div>
</body>
</html>
