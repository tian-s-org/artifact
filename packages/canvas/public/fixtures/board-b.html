<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>方案 B</title>
<style>
  :root { --accent: #b91c1c; --ink: #171417; --ink-2: #6b6166; --line: rgba(0,0,0,.09); }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #fff;
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: var(--ink); }
  .card { width: 100%; height: 100%; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 18px; }
  .accent { fill: var(--accent); }
  h1 { margin: 0; font-size: 40px; letter-spacing: .01em; font-weight: 700; text-transform: uppercase; }
  .tag { color: var(--ink-2); font-size: 15px; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .cell { background: #fff; padding: 22px; }
  .cell b { display: block; font-size: 13px; margin-bottom: 6px; }
  .cell span { color: var(--ink-2); font-size: 12px; }
  .swatches { display: flex; gap: 10px; }
  .sw { width: 56px; text-align: center; font-size: 11px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; }
  .sw i { display: block; height: 44px; border-radius: 0; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.06); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-label="Northstar B">
        <rect x="10" y="10" width="52" height="52" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <path class="accent" d="M22 50 L36 22 L50 50 Z"/>
      </svg>
      <div>
        <h1>Northstar</h1>
        <div class="tag">同一份设计稿的同名 class，颜色完全不同</div>
      </div>
    </div>

    <div class="grid">
      <div class="cell"><b>标志</b><span>方形外框 + 实心三角</span></div>
      <div class="cell"><b>字标</b><span>全大写，字重 700</span></div>
      <div class="cell"><b>安全边距</b><span>四周留 1× 框线宽度</span></div>
    </div>

    <div class="swatches">
      <div class="sw"><i style="background:#b91c1c"></i>#B91C1C</div>
      <div class="sw"><i style="background:#171417"></i>#171417</div>
      <div class="sw"><i style="background:#ffffff"></i>#FFFFFF</div>
      <div class="sw"><i style="background:#4b5563"></i>#4B5563</div>
    </div>
  </div>
</body>
</html>
