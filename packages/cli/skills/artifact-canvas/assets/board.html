<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>画板</title>
<style>
  /* 画板骨架：满屏、无脚本、令牌走 CSS 变量。
     复制到 artboards/<画板 id>/index.html 再改成真的设计。 */
  :root {
    --surface: #ffffff;
    --canvas: #f5f5f5;
    --text: #1d1d1f;
    --text-2: #5a6169;
    --text-3: #8a9099;
    --line: rgba(0, 0, 0, 0.075);
    --fill: rgba(118, 118, 128, 0.12);
    --accent: #007aff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 下面只是占位，换成真的界面 */
  .placeholder {
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--text-3);
  }
</style>
</head>
<body>
  <div class="placeholder">画板占位</div>
</body>
</html>
