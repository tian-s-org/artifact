<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>画板</title>
<style>
  /* 画板骨架：满屏、无脚本、令牌走 CSS 变量。
     复制到 artboards/<画板 id>/index.html 再改成真的设计。 */
  :root {
    --surface: #ffffff;
    --canvas: #f5f5f5;
    --text: #1d1d1f;
    --text-2: #5a6169;
    --text-3: #8a9099;
    --line: rgba(0, 0, 0, 0.075);
    --fill: rgba(118, 118, 128, 0.12);
    --accent: #007aff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 图标：sprite 必须内联在这一页里（跨文件的 <use> 在 sandbox 下不渲染） */
  .sprite { display: none; }
  .i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor;
       stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .i.sm { width: 12px; height: 12px; }
  .i.lg { width: 18px; height: 18px; }

  /* 下面只是占位，换成真的界面 */
  .placeholder {
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--text-3);
  }
</style>
</head>
<body>
  <!-- 图标 sprite：把这一页用到的图标抄进来，正文用 <svg class="i"><use href="#i-check"/></svg> -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.6l3.1 3.1 5.9-6.9"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  </svg>

  <div class="placeholder">画板占位</div>
</body>
</html>
